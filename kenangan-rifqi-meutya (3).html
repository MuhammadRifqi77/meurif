<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meurif · Album Kenangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffe58a; --paper:#fffdf4; --ink:#3b0b12; --mute:#7a3b2e; --rose:#c8102e; --sun:#ffd23f; --sage:#8f0d22; --line:#f0c24a;
  --shadow:0 10px 24px rgba(110,10,20,.22);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif; --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a0709; --paper:#3f1015; --ink:#fff0c2; --mute:#e8bf8a; --rose:#d62839; --sun:#ffd23f; --sage:#ffd23f; --line:#5c1d22; --shadow:0 10px 24px rgba(0,0,0,.55);}}
:root[data-theme="dark"]{--bg:#2a0709; --paper:#3f1015; --ink:#fff0c2; --mute:#e8bf8a; --rose:#d62839; --sun:#ffd23f; --sage:#ffd23f; --line:#5c1d22; --shadow:0 10px 24px rgba(0,0,0,.55);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:0 20px 80px}
.hero{text-align:center;padding:64px 0 40px}
.hero p.sub{margin:0 0 12px;color:var(--mute);font-size:1rem}
h1{font-family:var(--serif);font-weight:600;font-style:italic;font-size:clamp(2.6rem,9vw,5.6rem);line-height:1.02;margin:0;letter-spacing:-.01em}
h1 span{display:block}
h1 .amp{font-size:.55em;color:var(--rose);line-height:1.2}
.count{margin:36px auto 0;display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:20px 38px;background:var(--rose);border:3px solid var(--sun);border-radius:60px 60px 18px 18px}
.count b{font-family:var(--serif);font-size:3.6rem;line-height:1;font-weight:600;color:var(--sun)}
.count small{color:#fff;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:28px 0 22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.bar h2{margin:0;font-family:var(--serif);font-size:1.9rem;font-weight:600}
.bar h2 em{font-style:normal;color:var(--mute);font-family:var(--sans);font-size:.95rem;font-weight:400;margin-left:8px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 20px;background:var(--rose);color:#fff;font-weight:500}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--rose);border:1px solid var(--rose)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--sage);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block}
[hidden]{display:none!important}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.grid{columns:3 240px;column-gap:22px}
figure{break-inside:avoid;margin:0 0 26px;background:var(--paper);padding:10px 10px 14px;box-shadow:var(--shadow);border-radius:4px;cursor:pointer;transition:transform .2s}
figure:nth-child(3n+1){transform:rotate(-1.2deg)} figure:nth-child(3n+2){transform:rotate(.9deg)} figure:nth-child(3n){transform:rotate(-.4deg)}
figure:hover{transform:rotate(0) scale(1.02)}
figure img{display:block;width:100%;height:auto;border-radius:2px}
figcaption{font-family:var(--serif);font-style:italic;font-size:1.2rem;padding:10px 4px 0;line-height:1.25}
figcaption time{display:block;font-family:var(--sans);font-style:normal;font-size:.8rem;color:var(--mute);margin-top:4px}
.empty{text-align:center;padding:60px 20px;color:var(--mute);border:1.5px dashed var(--line);border-radius:18px}
.empty h3{font-family:var(--serif);font-size:1.7rem;margin:0 0 6px;color:var(--ink)}
dialog{border:0;padding:0;border-radius:14px;background:var(--paper);color:var(--ink);width:min(680px,94vw);max-height:92vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(15,8,22,.72)}
dialog img{display:block;width:100%;max-height:60vh;object-fit:contain;background:#0002}
.form{padding:16px 18px 18px;display:grid;gap:10px}
.form label{font-size:.85rem;color:var(--mute);display:grid;gap:4px}
.form input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
footer{text-align:center;color:var(--mute);font-size:.85rem;margin-top:30px}
.note{font-size:.85rem;color:var(--mute);margin:0 0 18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){figure{transition:none}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <p class="sub">Album kenangan kami, sejak 26 Februari 2026</p>
    <h1>Meutya & Rifqi</h1>
    <div class="count" aria-live="polite"><b id="days">0</b><small id="detail">hari bersama</small></div>
  </header>

  <section>
    <div class="bar">
      <h2>Foto kenangan<em id="total"></em></h2>
      <div class="actions">
        <button class="ghost" id="music" type="button" aria-pressed="false">♪ Putar lagu</button>
        <button class="ghost" id="mig" type="button" hidden>Pindahkan foto lama</button>
        <label class="btn" id="addlbl" for="file" tabindex="-1">Tambah foto</label>
        <input id="file" type="file" accept="image/*" multiple>
      </div>
    </div>
    <p class="note" id="note"></p>
    <div id="gallery" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <h3>Belum ada foto</h3>
      <p>Tekan “Tambah foto” untuk menyimpan kenangan pertama kalian.</p>
    </div>
  </section>
  <footer>Dibuat dengan cinta untuk Meutya Rahman</footer>
</main>

<dialog id="dlg">
  <img id="big" alt="">
  <div class="form">
    <label>Keterangan<input id="cap" maxlength="120" placeholder="Ceritakan momen ini"></label>
    <label>Tanggal<input id="dt" type="date"></label>
    <div class="row">
      <button class="danger" id="del">Hapus foto</button>
      <span class="actions"><button class="ghost" id="close">Tutup</button><button id="save">Simpan</button></span>
    </div>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
(function(){
  var START = new Date(2026,1,26);
  var $ = function(i){return document.getElementById(i)};
  var photos = [], current = null, mem = false, db = null;

  /* ---- hitung hari bersama ---- */
  function tick(){
    var now = new Date(), t0 = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var d = Math.round((t0-START)/864e5);
    if(d<0){$('days').textContent=-d;$('detail').textContent='hari lagi menuju 26 Februari 2026';return;}
    var m=(t0.getFullYear()-START.getFullYear())*12+t0.getMonth()-START.getMonth();
    var anchor=new Date(START.getFullYear(),START.getMonth()+m,START.getDate());
    if(anchor>t0){m--;anchor=new Date(START.getFullYear(),START.getMonth()+m,START.getDate());}
    var r=Math.round((t0-anchor)/864e5);
    $('days').textContent=(d+1).toLocaleString('id-ID');
    $('detail').textContent='hari bersama · '+m+' bulan '+r+' hari';
  }
  tick(); setInterval(tick,6e4);

  /* ---- penyimpanan: lokal (cadangan) atau bersama (db + assets) ---- */
  var mode='local', col=null, assetsApi=null, unsub=null, localPhotos=[], lp=[];
  function openLocal(cb){
    try{
      var rq=indexedDB.open('kenangan-rifqi-meutya',1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore('p',{keyPath:'id'})};
      rq.onsuccess=function(){db=rq.result;cb()};
      rq.onerror=function(){mem=true;cb()};
    }catch(e){mem=true;cb()}
  }
  function store(m){return db.transaction('p',m).objectStore('p')}
  function loadLocal(cb){
    if(mem){cb();return}
    try{var r=store('readonly').getAll();r.onsuccess=function(){lp=r.result||[];cb()};r.onerror=function(){cb()}}catch(e){cb()}
  }
  function lput(p){if(mem)return;try{store('readwrite').put(p)}catch(e){}}
  function lremove(id){if(mem)return;try{store('readwrite').delete(id)}catch(e){}}
  function put(p){
    if(mode==='shared')return col.doc(p.id).set({assetId:p.assetId,caption:p.caption||'',date:p.date||'',added:p.added||0});
    lput(p);return Promise.resolve();
  }
  function remove(p){
    if(mode==='shared'){
      return col.doc(p.id).delete().then(function(){if(p.assetId&&assetsApi)assetsApi.delete(p.assetId).catch(function(){})});
    }
    lremove(p.id);return Promise.resolve();
  }
  function setNote(t){$('note').textContent=t}
  function refreshUI(){
    var sh=mode==='shared';
    $('addlbl').hidden=sh&&!assetsApi;
    $('mig').hidden=!(sh&&assetsApi&&localPhotos.length);
    setNote(sh?'Album bersama: foto yang ditambahkan muncul di semua perangkat yang membuka halaman ini.'+(assetsApi?'':' Akun ini hanya bisa melihat; penambahan foto khusus Editor.')
      :'');
  }
  function goShared(dbApi,as){
    mode='shared';assetsApi=as;col=dbApi.collection('photos');
    var timer=setTimeout(function(){setNote('Album bersama belum bisa dijangkau. Menunggu koneksi…')},10000);
    unsub=col.onSnapshot(function(s){
      clearTimeout(timer);
      photos=s.docs.map(function(d){var x=d.data()||{};return{id:d.id,assetId:x.assetId,src:'/_blob/'+x.assetId,caption:x.caption||'',date:x.date||'',added:x.added||0}});
      refreshUI();render();
    },function(e){
      clearTimeout(timer);mode='local';photos=localPhotos.slice();refreshUI();render();
      toast('Album bersama tidak bisa dibuka, memakai penyimpanan lokal');
    });
    refreshUI();
  }
  $('mig').onclick=async function(){
    var b=this;b.disabled=true;var n=0;
    for(var i=0;i<localPhotos.length;i++){
      var p=localPhotos[i];
      try{
        var blob=await (await fetch(p.src)).blob(), up=await assetsApi.upload(blob);
        await col.doc(p.id).set({assetId:up.id,caption:p.caption||'',date:p.date||'',added:p.added||0});
        lremove(p.id);n++;
      }catch(e){}
    }
    localPhotos=localPhotos.filter(function(p){return false});b.disabled=false;
    loadLocal(function(){localPhotos=lp.slice();refreshUI()});toast(n+' foto dipindahkan');
  };

  /* ---- tampilan ---- */
  function fmt(s){
    if(!s)return '';
    var a=s.split('-');return new Date(a[0],a[1]-1,a[2]).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  }
  function render(){
    photos.sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||b.added-a.added});
    var g=$('gallery');g.textContent='';
    photos.forEach(function(p){
      var f=document.createElement('figure');f.tabIndex=0;
      var im=document.createElement('img');im.src=p.src;im.alt=p.caption||'Foto kenangan';im.loading='lazy';
      var c=document.createElement('figcaption');
      c.appendChild(document.createTextNode(p.caption||'Tanpa keterangan'));
      var t=document.createElement('time');t.textContent=fmt(p.date);c.appendChild(t);
      f.appendChild(im);f.appendChild(c);
      f.onclick=function(){show(p)};
      f.onkeydown=function(e){if(e.key==='Enter')show(p)};
      g.appendChild(f);
    });
    $('empty').hidden=photos.length>0;
    $('total').textContent=photos.length?photos.length+' foto':'';
  }
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2400)}

  function show(p){
    current=p;$('big').src=p.src;$('cap').value=p.caption||'';$('dt').value=p.date||'';
    $('dlg').showModal();
  }
  $('close').onclick=function(){$('dlg').close()};
  $('dlg').addEventListener('click',function(e){if(e.target===this)this.close()});
  $('save').onclick=function(){
    current.caption=$('cap').value.trim();current.date=$('dt').value;
    put(current).then(function(){toast('Perubahan disimpan')},function(){toast('Gagal menyimpan')});
    if(mode==='local')render();
    $('dlg').close();
  };
  $('del').onclick=function(){
    if(!confirm('Hapus foto ini?'))return;
    var p=current;
    remove(p).then(function(){
      if(mode==='local'){photos=photos.filter(function(x){return x.id!==p.id});render()}
      toast('Foto dihapus');
    },function(){toast('Gagal menghapus (hanya Editor yang bisa menghapus)')});
    $('dlg').close();
  };

  /* ---- unggah: perkecil dulu agar hemat ruang ---- */
  function shrink(file){
    return new Promise(function(ok){
      var r=new FileReader();
      r.onload=function(){
        var im=new Image();
        im.onload=function(){
          var s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');
          c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          c.toBlob(function(b){ok(b)},'image/jpeg',.82);
        };
        im.onerror=function(){ok(null)};
        im.src=r.result;
      };
      r.onerror=function(){ok(null)};
      r.readAsDataURL(file);
    });
  }
  function toData(b){return new Promise(function(ok){var r=new FileReader();r.onload=function(){ok(r.result)};r.readAsDataURL(b)})}
  function iso(ms){var d=new Date(ms||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  $('file').onchange=async function(){
    var files=Array.prototype.slice.call(this.files),n=0,self=this;
    if(!files.length)return;
    toast('Mengunggah…');
    for(var i=0;i<files.length;i++){
      try{
        var blob=await shrink(files[i]);if(!blob)continue;
        var id=Date.now()+'-'+i,date=iso(files[i].lastModified),p;
        if(mode==='shared'){
          var up=await assetsApi.upload(blob);
          p={id:id,assetId:up.id,src:up.url,caption:'',date:date,added:Date.now()+i};
          await put(p);
        }else{
          p={id:id,src:await toData(blob),caption:'',date:date,added:Date.now()+i};
          photos.push(p);lput(p);
        }
        n++;
      }catch(e){toast('Satu foto gagal diunggah')}
    }
    self.value='';render();toast(n+' foto ditambahkan');
  };

  /* ---- lagu latar: melodi lembut dibuat langsung oleh peramban ---- */
  var ac=null,master=null,playing=false,nextT=0,step=0,sched=null;
  var CH=[[261.63,329.63,392,493.88],[220,261.63,329.63,392],[174.61,220,261.63,329.63],[196,246.94,293.66,392]];
  function note(f,t,d,v,type){
    var o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
  }
  function bar(t){
    var c=CH[step%4],b=.75;step++;
    note(c[0]/2,t,b*4,.08,'sine');
    c.forEach(function(f){note(f,t,b*4,.022,'triangle')});
    [0,1,2,3,2,1,3,2].forEach(function(i,k){note(c[i]*2,t+k*b/2,b*1.6,.05,'sine')});
  }
  function pump(){while(nextT<ac.currentTime+1.5){bar(nextT);nextT+=3}}
  $('music').onclick=function(){
    var b=this;
    if(!ac){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC){toast('Peramban ini tidak mendukung audio');return}
      ac=new AC();master=ac.createGain();master.gain.value=.7;master.connect(ac.destination);
    }
    if(!playing){
      ac.resume();nextT=ac.currentTime+.1;pump();sched=setInterval(pump,500);
      playing=true;b.textContent='♪ Jeda lagu';b.setAttribute('aria-pressed','true');
    }else{
      clearInterval(sched);ac.suspend();playing=false;b.textContent='♪ Putar lagu';b.setAttribute('aria-pressed','false');
    }
  };

  /* ---- mulai ---- */
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  openLocal(function(){loadLocal(function(){
    localPhotos=lp.slice();
    if(mode==='local'){photos=localPhotos.slice();render()}
    refreshUI();
  })});
  (async function(){
    try{
      if(!window.claude||!window.claude.use)return;
      var d=await window.claude.use('db');if(!d)return;
      var a=null;try{a=await window.claude.use('assets')}catch(e){}
      goShared(d,a);
    }catch(e){}
  })();
})();
</script>
</body>
</html>
